services:
  n8n:
    image: n8nio/n8n
    env_file:
      - .env.local
    environment:
      CAMPAIGN_CALLBACK_URL: http://campaign-brief-studio:3000/api/webhooks/generation-complete
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  campaign-brief-studio:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      CAMPAIGN_DB_PATH: /app/data/campaign-brief-studio.sqlite
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/campaign-brief-studio
      APP_URL: http://campaign-brief-studio:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - campaign-brief-data:/app/data
    restart: unless-stopped

volumes:
  campaign-brief-data:
  n8n_data:
